<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0ea5e9"><title>ماسح الورق</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css"><link rel="stylesheet" href="css/tailwind.css"><link rel="stylesheet" href="css/app.css"></head>
<body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
<div id="app"></div>
<input type="file" id="cam" accept="image/*" capture="environment" class="hidden"><input type="file" id="gal" accept="image/*" multiple class="hidden">
<div id="boot" class="fixed bottom-24 inset-x-0 mx-auto w-max max-w-[90%] bg-slate-900/90 text-white text-sm px-4 py-2 rounded-full z-[75] hidden"><i class="fa-solid fa-spinner fa-spin ml-2"></i> جاري تجهيز محرك المسح...</div>
<div id="ed" class="hidden fixed inset-0 z-[60] bg-slate-950 flex flex-col">
 <div class="flex items-center justify-between px-4 h-14 text-white" style="margin-top:env(safe-area-inset-top)"><button onclick="closeEd()" class="text-slate-300 px-2">إلغاء</button><b>اضبط الحواف</b><button onclick="doneEd()" class="text-sky-400 font-bold px-2">تم</button></div>
 <div class="flex-1 grid place-items-center overflow-hidden p-3"><div id="stage" class="relative inline-block leading-[0]"><img id="pic" class="max-w-full max-h-[68vh] select-none rounded" draggable="false">
  <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="absolute inset-0 w-full h-full pointer-events-none"><polygon id="poly" fill="rgba(14,165,233,.22)" stroke="#38bdf8" stroke-width="1" vector-effect="non-scaling-stroke"/></svg></div></div>
 <div id="edchips" class="flex gap-2 overflow-x-auto px-4 pb-6"></div></div>
<div id="sheet" class="hidden fixed inset-0 z-[65]"><div onclick="closeFinish()" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
 <div class="absolute inset-x-0 bottom-0 bg-white rounded-t-[2rem] p-6 shadow-2xl max-w-3xl mx-auto" style="padding-bottom:calc(1.5rem + env(safe-area-inset-bottom))">
  <div class="w-12 h-1.5 rounded-full bg-slate-300 mx-auto mb-5"></div><h3 class="text-xl font-extrabold">حفظ <span id="sn"></span> صفحة</h3>
  <div id="nameBox"><label class="block text-sm text-slate-500 mt-4 mb-1.5">اسم الملف</label>
   <input id="nm" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3.5 text-lg outline-none focus:ring-4 focus:ring-sky-500/20 focus:border-sky-500" placeholder="مثال: ملخص الفيزياء">
   <div id="modes" class="grid grid-cols-2 gap-3 mt-4"></div></div>
  <button id="saveBtn" onclick="finish()" class="w-full mt-5 bg-sky-600 text-white font-bold text-lg rounded-2xl py-4 shadow-lg shadow-sky-600/30 active:scale-95 transition">حفظ</button></div></div>
<div id="viewer" onclick="this.classList.add('hidden')" class="hidden fixed inset-0 bg-black/95 z-[70] p-3 overflow-auto"><img id="vimg" class="mx-auto max-w-full rounded-xl"></div>
<div id="toast" class="fixed top-16 inset-x-0 mx-auto w-max max-w-[90%] bg-slate-900/95 text-white px-5 py-3 rounded-2xl shadow-2xl text-sm opacity-0 pointer-events-none transition duration-300 z-[80]"></div>
<script src="scan-core.js"></script><script src="app.js"></script></body></html>
